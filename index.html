<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6fed"><title>Mon Budget Essentiel</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=1.0.0"></head><body>
<header><div><h1>💙 Mon Budget</h1><p>Essentiel</p></div><button id="theme">🌙</button></header>
<main>
<section id="home" class="screen active">
<article class="hero"><span>Disponible réel</span><strong id="available">0 €</strong><small id="forecast"></small></article>
<div class="grid"><article><span>Solde du compte</span><b id="balance">0 €</b></article><article><span>CB différée</span><b id="card">0 €</b><small>Débit le 4</small></article></div>
<div class="grid"><article><span>Prochain revenu</span><b id="nextIncome">—</b><small id="nextIncomeLabel">Aucun</small></article><article><span>Prochain prélèvement</span><b id="nextCharge">—</b><small id="nextChargeLabel">Aucun</small></article></div>
<article><span>Budget du jour</span><b class="bigblue" id="daily">0 €</b></article>
<article><div class="title"><h2>Prochaines opérations</h2><button data-tab="calendar">Voir tout</button></div><div id="upcoming"></div></article>
</section>

<section id="add" class="screen"><article><h2>Ajouter</h2>
<div class="seg"><button id="expenseType" class="active">Dépense</button><button id="incomeType">Revenu</button></div>
<label>Libellé</label><input id="label" placeholder="Ex. Courses">
<label>Montant</label><input id="amount" inputmode="decimal" placeholder="0,00">
<label>Catégorie</label><select id="category"><option>Alimentation</option><option>Maison</option><option>Transport</option><option>Santé</option><option>Loisirs</option><option>Famille</option><option>Autre</option></select>
<label>Date</label><input id="date" type="date">
<div id="paymentBox"><label>Mode de paiement</label><select id="payment"><option value="deferred">Carte à débit différé</option><option value="current">Compte courant</option></select></div>
<button id="saveOp" class="primary">Enregistrer</button><p id="feedback"></p></article></section>

<section id="calendar" class="screen"><article><div class="title"><h2>Agenda</h2><select id="filter"><option value="all">Tout</option><option value="income">Revenus</option><option value="expense">Dépenses</option><option value="charge">Prélèvements</option><option value="card">CB</option></select></div><div id="events"></div></article></section>

<section id="settings" class="screen">
<article><h2>Réglages</h2><label>Solde du compte</label><input id="settingBalance" inputmode="decimal"><label>Jour du débit CB</label><input id="cardDay" type="number" min="1" max="28"><button id="saveSettings" class="primary">Enregistrer</button></article>
<article><h2>Revenus fixes</h2><input id="irLabel" placeholder="Nom"><input id="irAmount" inputmode="decimal" placeholder="Montant"><input id="irDay" type="number" min="1" max="31" placeholder="Jour"><button id="addIncomeRule" class="soft">Ajouter</button><div id="incomeRules"></div></article>
<article><h2>Prélèvements fixes</h2><input id="crLabel" placeholder="Nom"><input id="crAmount" inputmode="decimal" placeholder="Montant"><input id="crDay" type="number" min="1" max="31" placeholder="Jour"><button id="addChargeRule" class="soft">Ajouter</button><div id="chargeRules"></div></article>
<article><h2>Sauvegarde</h2><button id="export" class="soft full">Exporter</button><label class="file">Importer<input id="import" type="file" accept="application/json"></label><button id="reset" class="danger full">Réinitialiser</button></article>
</section>
</main>
<nav><button data-tab="home" class="active"><span>🏠</span><small>Accueil</small></button><button data-tab="add"><span>➕</span><small>Ajouter</small></button><button data-tab="calendar"><span>📅</span><small>Agenda</small></button><button data-tab="settings"><span>⚙️</span><small>Réglages</small></button></nav>
<script src="app.js?v=1.0.0"></script></body></html>
